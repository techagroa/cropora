<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Digital Data & Records Royal Blue Arc (Non-Green) -->
    <linearGradient id="cropArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Weather & Advisory Golden Arc -->
    <linearGradient id="sunArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Marketplace, Govt & Community Teal Arc -->
    <linearGradient id="communityArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Leaf Primary Gradient -->
    <linearGradient id="leafPrimary" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Leaf Secondary Gradient -->
    <linearGradient id="leafSecondary" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- UNIFIED ECOSYSTEM ORBIT (Interlocking 3-Service Arcs surrounding the central hub) -->

  <!-- Arc 1: Top-Left to Right Royal Sapphire Blue Arc (Data & Farm Financial Records) -->
  <path
    d="M 130 200 
           A 150 150 0 0 1 370 180 
           C 340 145 290 120 230 120 
           C 180 120 145 150 130 200 Z"
    fill="url(#cropArcGrad)" />

  <!-- Arc 2: Right to Bottom Golden Arc (Weather Advisory & Seasonal Growth) -->
  <path
    d="M 370 180 
           A 150 150 0 0 1 230 406 
           C 255 370 265 315 240 270 
           C 275 300 330 310 370 180 Z"
    fill="url(#sunArcGrad)" />

  <!-- Arc 3: Bottom to Left Teal Arc (Marketplace, Govt Schemes & Community) -->
  <path
    d="M 230 406 
           A 150 150 0 0 1 130 200 
           C 160 240 190 270 240 270 
           C 175 310 160 370 230 406 Z"
    fill="url(#communityArcGrad)" />

  <!-- CENTRAL AGRICULTURAL SPROUT & UNIFIED HUB NODE -->

  <!-- Natural Soil/Seed Foundation Node -->
  <circle cx="256" cy="315" r="22" fill="#D49B6A" />
  <circle cx="256" cy="315" r="12" fill="#8C572B" />

  <!-- Main Sprout Leaf (Right Primary) -->
  <path
    d="M 256 300
           C 270 250 305 210 345 180
           C 355 172 368 165 368 165
           C 368 165 355 185 342 205
           C 310 250 275 285 256 300 Z"
    fill="url(#leafPrimary)" />

  <!-- Complementary Leaf (Left Secondary) -->
  <path
    d="M 256 300
           C 240 255 210 230 175 205
           C 162 196 150 188 150 188
           C 150 188 165 202 178 218
           C 205 252 235 282 256 300 Z"
    fill="url(#leafSecondary)" />

  <!-- Natural Light-Brown Plant Stem -->
  <path d="M 256 315 C 256 260 270 220 280 185"
    stroke="#C48B58" stroke-width="6" stroke-linecap="round" fill="none" opacity="1.0" />

  <!-- Natural Light-Brown Apex Stem Node -->
  <circle cx="280" cy="185" r="7" fill="#D49B6A" />

</svg>
